name: Documentation
description: Something in the docs, the tooltips or the app's wording is missing, wrong or unclear.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: A page URL, or the place in the app (dialog, tooltip, setting).
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      options:
        - Missing
        - Incorrect
        - Out of date
        - Unclear
        - Typo or translation
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What it says, what it should say, or what you looked for and could not find.
    validations:
      required: true
